<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>נושא השיחה בשולחן</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{display:grid;place-items:center;grid-template:minmax(0,1fr)/minmax(0,1fr);padding:0;font:650 20px/1.13 system-ui,sans-serif;pointer-events:none}
output{display:block;width:max-content;overflow:hidden;text-align:center;overflow-wrap:anywhere;max-width:100%;max-height:100%;color:#fffcef;background:#33432fec;border-radius:9px;padding:3px 7px}
output:empty{display:none}output:not(:empty)::before{content:attr(data-desk) ' · ';font-size:.78em;color:#dce6cb;font-weight:550}
</style>
<output id="title" aria-live="polite"></output>
<script type="module">
import {announceSeat} from './seating.js';
import {inSession} from './timing.js';
const params = new URLSearchParams(location.search);
const room = params.get('room');
const desk = params.get('desk');
const title = document.querySelector('output');
title.dataset.desk=desk || '';
if (/^[A-Za-z0-9]{20}$/.test(room) && ['זית','גפן','חצר','כרם','הבוסתן'].includes(desk)) {
  announceSeat(room,params);
  let lastBoardUpdate = 0;
  let loading = false;
  const channel = typeof BroadcastChannel === 'function' ? new BroadcastChannel('olive-house/table-topics/v1') : null;
  function fitTitle() {
    if (!title.textContent) return;
    title.style.fontSize='';
    for (let size=19; size>=10 && title.scrollHeight>title.clientHeight; size--) {
      title.style.fontSize=size+'px';
    }
  }
  new ResizeObserver(fitTitle).observe(document.documentElement);
  function show(talks) {
    const topic = talks.find(t => t.desk === desk)?.title;
    const text = typeof topic === 'string' ? topic : '';
    if (text === title.textContent) return;
    title.textContent = text;
    title.title = title.textContent;
    fitTitle();
  }
  if (channel) {
    channel.onmessage = ({data}) => {
      if (data?.type !== 'titles' || data.room !== room || !Array.isArray(data.titles)) return;
      show(data.titles);
      lastBoardUpdate = Date.now();
    };
    channel.postMessage({type:'read', room});
  }
  // Most rooms already poll once via the board. A sign also works when the dock is hidden.
  async function fallback() {
    if (loading || document.hidden || Date.now()-lastBoardUpdate < 14000) return;
    loading = true;
    const started = Date.now();
    try {
      const response = await fetch('https://cmtbwohbktirmplieeeq.supabase.co/rest/v1/rpc/os_house_board', {
        method:'POST', headers:{apikey:'sb_publishable_tk18F8g4AS7oQF9eV9qGQw_nONj_xiX','Content-Type':'application/json'},
        body:JSON.stringify({device:null}), signal:AbortSignal.timeout(8000)
      });
      if (!response.ok) throw Error();
      const board = await response.json();
      if (lastBoardUpdate < started) show(board.talks.filter(t => inSession(t) && t.room === room));
    } catch {
      if (lastBoardUpdate < started) show([]);
    } finally { loading = false; }
  }
  setTimeout(fallback,1500 + Math.random()*1000);
  setInterval(fallback,15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fallback(); });
}
</script>
</html>
