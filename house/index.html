*{box-sizing:border-box}html,body{background:transparent}body{margin:0;color:#293526;font:16px/1.5 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:clamp(10px,3vw,24px)}header,nav,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}header{justify-content:space-between}h1,h2,h3,p{margin:.25em 0}h1{font-size:clamp(18px,4vw,26px)}h2{font-size:20px}h3{font-size:16px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #a8ad99;border-radius:9px;background:#fffdf7;color:inherit;padding:5px 11px}button:disabled{opacity:.55}button.primary,[aria-pressed=true]{background:#435c38;color:white;border-color:#435c38}button.topic{border:none;padding:3px 0;background:none;font-weight:700;text-align:start;color:#354e2d}nav{margin:8px 0}section,article{border-top:1px solid #c9cbbb;padding:10px 0}small,label{display:block}small{color:#55604e}input,select,textarea{display:block;width:100%;padding:8px;border:1px solid #9ca591;border-radius:7px;margin:3px 0 10px;background:#fffefb}textarea{min-height:70px}button:focus-visible{outline:3px solid #a47b36}#status{font-size:14px;color:#744411}dialog{color:inherit;width:min(460px,95vw);max-height:94vh;border:1px solid #a2ad95;border-radius:14px;background:#faf9f2}dialog::backdrop{background:#19231577}.actions{margin-top:7px}article p{white-space:pre-wrap;overflow-wrap:anywhere}@media(prefers-reduced-motion:no-preference){article{animation:show .22s ease-out}@keyframes show{from{opacity:.5}to{opacity:1}}}

  #status:empty{display:none}
